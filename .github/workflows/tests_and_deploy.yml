name: Tests, Evaluation, and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run automated tests
        run: python -m pytest -q

      - name: Run bounded decision evaluation
        run: python -m eval.run_eval

  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync repository to Hugging Face Space when configured
        env:
          HF_DEPLOY_TOKEN: ${{ secrets.HF_DEPLOY_TOKEN }}
        run: |
          if [ -z "$HF_DEPLOY_TOKEN" ]; then
            echo "HF_DEPLOY_TOKEN is not configured; skipping Hugging Face deployment."
            exit 0
          fi
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git remote add space https://FlyingNunchucks:${HF_DEPLOY_TOKEN}@huggingface.co/spaces/FlyingNunchucks/01-autonomous-decision-agent
          git push --force space main
